<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TelStore Bot — 2 minute demo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    min-height: 100%;
    background: #0f1117;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .frame { width: 100%; max-width: 100vw; }
  video {
    width: 100%;
    height: auto;
    max-height: 100vh;
    display: block;
    background: #000;
    object-fit: contain;
  }
  .fallback {
    color: #e8e8ea;
    font-family: system-ui, sans-serif;
    padding: 28px;
    text-align: center;
    line-height: 1.6;
  }
  .fallback a { color: #ffd600; }
</style>
</head>
<body>
  <div class="frame">
    <video controls playsinline preload="metadata"
           poster="video/TelStore-Demo-thumb.png"
           src="video/TelStore-Demo.mp4">
      <p class="fallback">
        Your browser cannot play this video.
        <a href="video/TelStore-Demo.mp4">Download the demo (MP4, 11 MB)</a>
      </p>
    </video>
  </div>
  <script>
    // If the video fails, make the failure obvious rather than showing a black box.
    var v = document.querySelector('video');
    v.addEventListener('error', function () {
      document.body.innerHTML =
        '<div class="fallback"><p>Sorry, the video could not load.</p>' +
        '<p><a href="video/TelStore-Demo.mp4">Download it instead (MP4, 11 MB)</a></p></div>';
    });
  </script>
</body>
</html>
